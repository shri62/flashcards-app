<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flashcard Study App</title>
	<link rel="stylesheet" href="styles.css">
	<script src="app.js" defer></script>
</head>
<body>
	<header>
		<h1>Flashcard Study App</h1>
		<button type="button" id="new-deck-button">New Deck</button>
	</header>

	<div class="app-layout">
		<aside aria-labelledby="decks-heading">
			<h2 id="decks-heading">My Decks</h2>

			<form role="search">
				<label for="deck-search">Search decks</label>
				<input type="search" id="deck-search" name="deck-search" placeholder="Find a deck">
			</form>

			<ul id="deck-list" aria-label="Deck list">
				<li><button type="button" aria-current="true">Getting Started</button></li>
			</ul>

			<nav aria-label="Deck controls">
				<button type="button" id="edit-deck-button">Rename Deck</button>
				<button type="button" id="delete-deck-button">Delete Deck</button>
			</nav>
		</aside>

		<main>
			<section aria-labelledby="study-heading">
				<h2 id="study-heading">Study: Getting Started</h2>

				<article class="flashcard" aria-label="Flashcard">
					<div class="flashcard-front">
						<h3>Question</h3>
						<p>What does HTML stand for?</p>
					</div>
					<div class="flashcard-back" hidden>
						<h3>Answer</h3>
						<p>HyperText Markup Language</p>
					</div>
				</article>

				<nav aria-label="Flashcard controls">
					<button type="button" id="previous-button">Previous</button>
					<button type="button" id="next-button">Next</button>
					<button type="button" id="flip-button">Flip</button>
					<button type="button" id="shuffle-button">Shuffle</button>
					<button type="button" id="new-card-button">New Card</button>
					<button type="button" id="edit-card-button">Edit Card</button>
					<button type="button" id="delete-card-button">Delete Card</button>
				</nav>
			</section>
		</main>
	</div>
</body>
</html>
